version: '3.8'

services:
  # Gitea - Git 代码托管
  gitea:
    image: gitea/gitea:1.22.2
    container_name: gitea
    restart: unless-stopped
    environment:
      - USER_UID=1000
      - USER_GID=1000
      - DB_TYPE=postgres
      - DB_HOST=postgres
      - DB_NAME=gitea
      - DB_USER=gitea
      - DB_PASSWD=${GITEA_DB_PASSWORD}
      - GITEA__server__DOMAIN=gitea.${DOMAIN}
      - GITEA__server__ROOT_URL=https://gitea.${DOMAIN}
      - GITEA__server__SSH_DOMAIN=gitea.${DOMAIN}
      - GITEA__server__SSH_PORT=2222
      - GITEA__service__DISABLE_REGISTRATION=true
      - GITEA__log__LEVEL=info
      - GITEA__oauth2__ENABLE=true
      - GITEA__oauth2__JWT_SECRET=${GITEA_JWT_SECRET}
    volumes:
      - gitea_data:/data
      - /etc/timezone:/etc/timezone:ro
      - /etc/localtime:/etc/localtime:ro
    networks:
      - traefik-public
      - internal
    depends_on:
      - postgres
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.gitea.rule=Host(`gitea.${DOMAIN}`)"
      - "traefik.http.routers.gitea.entrypoints=websecure"
      - "traefik.http.routers.gitea.tls=true"
      - "traefik.http.routers.gitea.tls.certresolver=letsencrypt"
      - "traefik.http.services.gitea.loadbalancer.server.port=3000"
      - "traefik.http.routers.gitea.middlewares=default-headers@file"
      - "com.centurylinklabs.watchtower.enable=true"

  # Vaultwarden - 密码管理器
  vaultwarden:
    image: vaultwarden/server:1.32.0
    container_name: vaultwarden
    restart: unless-stopped
    environment:
      - ADMIN_TOKEN=${VAULTWARDEN_ADMIN_TOKEN}
      - SIGNUPS_ALLOWED=false
      - INVITATIONS_ALLOWED=true
      - DOMAIN=https://vaultwarden.${DOMAIN}
      - DATABASE_URL=postgresql://vaultwarden:${VAULTWARDEN_DB_PASSWORD}@postgres:5432/vaultwarden
      - SMTP_HOST=${SMTP_HOST}
      - SMTP_PORT=${SMTP_PORT}
      - SMTP_FROM=${SMTP_FROM}
      - SMTP_USERNAME=${SMTP_USER}
      - SMTP_PASSWORD=${SMTP_PASS}
      - SMTP_SECURITY=starttls
      - LOG_LEVEL=warn
      - ROCKET_ADDRESS=0.0.0.0
      - ROCKET_PORT=80
    volumes:
      - vaultwarden_data:/data
    networks:
      - traefik-public
      - internal
    depends_on:
      - postgres
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.vaultwarden.rule=Host(`vaultwarden.${DOMAIN}`)"
      - "traefik.http.routers.vaultwarden.entrypoints=websecure"
      - "traefik.http.routers.vaultwarden.tls=true"
      - "traefik.http.routers.vaultwarden.tls.certresolver=letsencrypt"
      - "traefik.http.services.vaultwarden.loadbalancer.server.port=80"
      - "traefik.http.routers.vaultwarden.middlewares=default-headers@file"
      - "com.centurylinklabs.watchtower.enable=true"

  # Outline - 团队知识库
  outline:
    image: outlinewiki/outline:0.80.2
    container_name: outline
    restart: unless-stopped
    environment:
      - DATABASE_URL=postgresql://outline:${OUTLINE_DB_PASSWORD}@postgres:5432/outline
      - DATABASE_CONNECTION_POOL_MIN=2
      - DATABASE_CONNECTION_POOL_MAX=10
      - REDIS_URL=redis://redis:6379
      - SECRET_KEY=${OUTLINE_SECRET_KEY}
      - UTILS_SECRET=${OUTLINE_UTILS_SECRET}
      - URL=https://outline.${DOMAIN}
      - PORT=3000
      - AWS_ACCESS_KEY_ID=${MINIO_ACCESS_KEY}
      - AWS_SECRET_ACCESS_KEY=${MINIO_SECRET_KEY}
      - AWS_S3_UPLOAD_BUCKET_URL=${MINIO_ENDPOINT}
      - AWS_S3_UPLOAD_BUCKET_NAME=outline
      - AWS_S3_UPLOAD_MAX_SIZE=26214400
      - AWS_S3_FORCE_PATH_STYLE=true
      - OIDC_CLIENT_ID=${OUTLINE_OIDC_CLIENT_ID}
      - OIDC_CLIENT_SECRET=${OUTLINE_OIDC_CLIENT_SECRET}
      - OIDC_AUTH_URI=https://authentik.${DOMAIN}/application/o/authorize/
      - OIDC_TOKEN_URI=https://authentik.${DOMAIN}/application/o/token/
      - OIDC_USERINFO_URI=https://authentik.${DOMAIN}/application/o/userinfo/
      - OIDC_SCOPES=openid profile email
      - OIDC_DISPLAY_NAME=Authentik
      - OIDC_DISCOVERY=false
    volumes:
      - outline_data:/var/lib/outline
    networks:
      - traefik-public
      - internal
    depends_on:
      - postgres
      - redis
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.outline.rule=Host(`outline.${DOMAIN}`)"
      - "traefik.http.routers.outline.entrypoints=websecure"
      - "traefik.http.routers.outline.tls=true"
      - "traefik.http.routers.outline.tls.certresolver=letsencrypt"
      - "traefik.http.services.outline.loadbalancer.server.port=3000"
      - "traefik.http.routers.outline.middlewares=default-headers@file"
      - "com.centurylinklabs.watchtower.enable=true"

  # Stirling PDF - PDF 处理工具
  stirling-pdf:
    image: frooodle/s-pdf:0.30.2
    container_name: stirling-pdf
    restart: unless-stopped
    environment:
      - DOCKER_ENABLE_SECURITY=false
      - INSTALL_BOOK_AND_ADVANCED_HTML_OPS=true
      - INSTALL_OCR=true
      - INSTALL_IMG_TO_PDF=true
      - INSTALL_URL_TO_PDF=true
      - INSTALL_EXTRACT_IMAGES=true
      - INSTALL_PDF_TO_IMG=true
      - INSTALL_REPAIR_PDF=true
      - INSTALL_MERGE_PDF=true
      - INSTALL_SPLIT_PDF=true
      - INSTALL_COMPRESS_PDF=true
      - INSTALL_HTML_TO_PDF=true
      - INSTALL_PDF_TO_WORD=true
      - INSTALL_PDF_TO_PRESENTATION=true
      - INSTALL_PDF_TO_EXCEL=true
      - INSTALL_PDF_TO_HTML=true
      - INSTALL_PDF_TO_MARKDOWN=true
      - INSTALL_PDF_TO_AUDIO=true
      - INSTALL_PDF_TO_TXT=true
      - INSTALL_PDF_TO_JSON=true
      - INSTALL_PDF_TO_XML=true
      - INSTALL_PDF_TO_CSV=true
      - INSTALL_PDF_TO_RTF=true
      - INSTALL_PDF_TO_EPUB=true
      - INSTALL_PDF_TO_MOBI=true
      - INSTALL_PDF_TO_AZW3=true
      - INSTALL_PDF_TO_FB2=true
      - INSTALL_PDF_TO_LIT=true
      - INSTALL_PDF_TO_PDB=true
      - INSTALL_PDF_TO_TCR=true
      - INSTALL_PDF_TO_PML=true
      - INSTALL_PDF_TO_RB=true
      - INSTALL_PDF_TO_SNB=true
      - INSTALL_PDF_TO_CBR=true
      - INSTALL_PDF_TO_CBZ=true
      - INSTALL_PDF_TO_DJVU=true
    volumes:
      - stirling_pdf_data:/usr/share/stirling-pdf
    networks:
      - traefik-public
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.stirling-pdf.rule=Host(`stirling-pdf.${DOMAIN}`)"
      - "traefik.http.routers.stirling-pdf.entrypoints=websecure"
      - "traefik.http.routers.stirling-pdf.tls=true"
      - "traefik.http.routers.stirling-pdf.tls.certresolver=letsencrypt"
      - "traefik.http.services.stirling-pdf.loadbalancer.server.port=8080"
      - "traefik.http.routers.stirling-pdf.middlewares=default-headers@file"
      - "com.centurylinklabs.watchtower.enable=true"

  # Excalidraw - 在线白板
  excalidraw:
    image: excalidraw/excalidraw:latest-sha
    container_name: excalidraw
    restart: unless-stopped
    environment:
      - REACT_APP_BACKEND_V2_GET_URL=https://excalidraw.${DOMAIN}/api/v2/
      - REACT_APP_BACKEND_V2_POST_URL=https://excalidraw.${DOMAIN}/api/v2/
    networks:
      - traefik-public
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.excalidraw.rule=Host(`excalidraw.${DOMAIN}`)"
      - "traefik.http.routers.excalidraw.entrypoints=websecure"
      - "traefik.http.routers.excalidraw.tls=true"
      - "traefik.http.routers.excalidraw.tls.certresolver=letsencrypt"
      - "traefik.http.services.excalidraw.loadbalancer.server.port=80"
      - "traefik.http.routers.excalidraw.middlewares=default-headers@file"
      - "com.centurylinklabs.watchtower.enable=true"

  # PostgreSQL - 共享数据库
  postgres:
    image: postgres:16.4
    container_name: postgres-productivity
    restart: unless-stopped
    environment:
      - POSTGRES_MULTIPLE_DATABASES=gitea,vaultwarden,outline
      - POSTGRES_USER=postgres
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD}
      - POSTGRES_INITDB_ARGS=--encoding=UTF8 --locale=C
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./scripts/init-databases.sh:/docker-entrypoint-initdb.d/init-databases.sh
    networks:
      - internal
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 30s
      timeout: 10s
      retries: 3

  # Redis - 缓存
  redis:
    image: redis:7.4-alpine
    container_name: redis-productivity
    restart: unless-stopped
    command: redis-server --appendonly yes --requirepass ${REDIS_PASSWORD}
    volumes:
      - redis_data:/data
    networks:
      - internal
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 30s
      timeout: 10s
      retries: 3

volumes:
  gitea_data:
  vaultwarden_data:
  outline_data:
  stirling_pdf_data:
  postgres_data:
  redis_data:

networks:
  traefik-public:
    external: true
  internal:
    driver: bridge