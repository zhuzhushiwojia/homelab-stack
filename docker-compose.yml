version: '3.8'

# Homelab Integration Testing Framework - Example Docker Compose
# This file demonstrates a sample homelab setup that can be tested
# using the integration testing framework.

services:
  # =============================================================================
  # Web Server - Nginx
  # =============================================================================
  nginx:
    image: nginx:1.25-alpine
    container_name: homelab-nginx
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx/html:/usr/share/nginx/html:ro
      - ./nginx/conf.d:/etc/nginx/conf.d:ro
      - ./nginx/logs:/var/log/nginx
    environment:
      - NGINX_HOST=localhost
      - NGINX_PORT=80
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://localhost/"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s
    networks:
      - homelab
    deploy:
      resources:
        limits:
          cpus: '0.5'
          memory: 128M
        reservations:
          memory: 64M
    labels:
      - "homelab.service=web"
      - "homelab.tier=frontend"

  # =============================================================================
  # Database - PostgreSQL
  # =============================================================================
  postgres:
    image: postgres:16-alpine
    container_name: homelab-postgres
    restart: unless-stopped
    ports:
      - "5432:5432"
    environment:
      - POSTGRES_USER=${DB_USER:-homelab}
      - POSTGRES_PASSWORD=${DB_PASSWORD:-changeme}
      - POSTGRES_DB=${DB_NAME:-homelab}
      - PGDATA=/var/lib/postgresql/data/pgdata
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./postgres/initdb:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER:-homelab} -d ${DB_NAME:-homelab}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s
    networks:
      - homelab
    deploy:
      resources:
        limits:
          cpus: '1.0'
          memory: 512M
        reservations:
          memory: 256M
    labels:
      - "homelab.service=database"
      - "homelab.tier=backend"

  # =============================================================================
  # Cache - Redis
  # =============================================================================
  redis:
    image: redis:7-alpine
    container_name: homelab-redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    command: redis-server --appendonly yes --maxmemory 128mb --maxmemory-policy allkeys-lru
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 5s
    networks:
      - homelab
    deploy:
      resources:
        limits:
          cpus: '0.25'
          memory: 128M
    labels:
      - "homelab.service=cache"
      - "homelab.tier=backend"

  # =============================================================================
  # Monitoring - Prometheus
  # =============================================================================
  prometheus:
    image: prom/prometheus:v2.48.0
    container_name: homelab-prometheus
    restart: unless-stopped
    ports:
      - "9090:9090"
    volumes:
      - ./prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - ./prometheus/rules:/etc/prometheus/rules:ro
      - prometheus_data:/prometheus
    command:
      - '--config.file=/etc/prometheus/prometheus.yml'
      - '--storage.tsdb.path=/prometheus'
      - '--storage.tsdb.retention.time=15d'
      - '--web.enable-lifecycle'
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://localhost:9090/-/healthy"]
      interval: 30s
      timeout: 10s
      retries: 3
    networks:
      - homelab
    deploy:
      resources:
        limits:
          cpus: '0.5'
          memory: 512M
    labels:
      - "homelab.service=monitoring"
      - "homelab.tier=observability"

  # =============================================================================
  # Visualization - Grafana
  # =============================================================================
  grafana:
    image: grafana/grafana:10.2.2
    container_name: homelab-grafana
    restart: unless-stopped
    ports:
      - "3000:3000"
    environment:
      - GF_SECURITY_ADMIN_USER=${GRAFANA_USER:-admin}
      - GF_SECURITY_ADMIN_PASSWORD=${GRAFANA_PASSWORD:-admin}
      - GF_USERS_ALLOW_SIGN_UP=false
      - GF_SERVER_ROOT_URL=http://localhost:3000
    volumes:
      - grafana_data:/var/lib/grafana
      - ./grafana/provisioning:/etc/grafana/provisioning:ro
      - ./grafana/dashboards:/var/lib/grafana/dashboards:ro
    healthcheck:
      test: ["CMD-SHELL", "wget -q --spider http://localhost:3000/api/health || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
    depends_on:
      - prometheus
    networks:
      - homelab
    deploy:
      resources:
        limits:
          cpus: '0.5'
          memory: 256M
    labels:
      - "homelab.service=visualization"
      - "homelab.tier=observability"

  # =============================================================================
  # Logging - Loki (optional, lightweight)
  # =============================================================================
  loki:
    image: grafana/loki:2.9.3
    container_name: homelab-loki
    restart: unless-stopped
    ports:
      - "3100:3100"
    volumes:
      - ./loki/loki.yml:/etc/loki/local-config.yaml:ro
      - loki_data:/loki
    command: -config.file=/etc/loki/local-config.yaml
    healthcheck:
      test: ["CMD-SHELL", "wget -q --spider http://localhost:3100/ready || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
    networks:
      - homelab
    deploy:
      resources:
        limits:
          cpus: '0.5'
          memory: 256M
    labels:
      - "homelab.service=logging"
      - "homelab.tier=observability"

  # =============================================================================
  # Reverse Proxy - Traefik (optional)
  # =============================================================================
  traefik:
    image: traefik:v2.10
    container_name: homelab-traefik
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true
    ports:
      - "8080:8080"
      - "8081:80"
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
      - ./traefik/traefik.yml:/etc/traefik/traefik.yml:ro
      - ./traefik/dynamic:/etc/traefik/dynamic:ro
    healthcheck:
      test: ["CMD", "traefik", "healthcheck", "--ping"]
      interval: 30s
      timeout: 10s
      retries: 3
    networks:
      - homelab
    deploy:
      resources:
        limits:
          cpus: '0.5'
          memory: 128M
    labels:
      - "homelab.service=proxy"
      - "homelab.tier=frontend"

# =============================================================================
# Volumes
# =============================================================================
volumes:
  postgres_data:
    driver: local
    labels:
      - "homelab.volume=database"
  redis_data:
    driver: local
    labels:
      - "homelab.volume=cache"
  prometheus_data:
    driver: local
    labels:
      - "homelab.volume=metrics"
  grafana_data:
    driver: local
    labels:
      - "homelab.volume=dashboards"
  loki_data:
    driver: local
    labels:
      - "homelab.volume=logs"

# =============================================================================
# Networks
# =============================================================================
networks:
  homelab:
    driver: bridge
    ipam:
      config:
        - subnet: 172.28.0.0/16
    labels:
      - "homelab.network=main"
